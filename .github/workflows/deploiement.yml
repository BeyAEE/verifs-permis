name: Tests et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (données, logique, parcours)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Intégrité des fiches et tests unitaires
        run: npx vitest run
      - name: Vérification des types
        run: npx tsc --noEmit -p .
      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Tests de bout en bout (iPhone SE, Pixel 7, ordinateur)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: test-results/
          retention-days: 7

  construction:
    name: Construction du site
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploiement:
    name: Mise en ligne (GitHub Pages)
    needs: construction
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
